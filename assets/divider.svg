<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" preserveAspectRatio="none" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="2" width="1200" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    .spark { animation: run 4.5s ease-in-out infinite; opacity: 0; }
    @keyframes run { 0% { transform: translateX(-260px); opacity: 0; } 10%, 85% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="2" width="1200" height="2" rx="1" fill="url(#line)"/>
  <g clip-path="url(#c)"><rect class="spark" x="0" y="0" width="260" height="6" fill="url(#spark)"/></g>
</svg>
